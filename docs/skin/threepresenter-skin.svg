<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Base ThreePresenter skin for OCRA.
  Derived from the visual language of frontend/public/skin.svg (OpenLIME skin).
  Only icon groups are included here; button chrome stays in ThreePresenter DOM/CSS.
-->
<svg
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .tp-fill {
        fill: #808080;
        stroke: none;
      }

      .tp-stroke {
        fill: none;
        stroke: #808080;
        stroke-width: 5;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        stroke-miterlimit: 4;
      }

      .tp-stroke-round {
        fill: none;
        stroke: #808080;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-miterlimit: 4;
      }
    </style>
  </defs>

  <!-- Copied/adapted from OpenLIME home button -->
  <g class="tp-home">
    <path
      class="tp-fill"
      d="m 197.14284,312.65259 -27.42316,20.56737 h 6.85579 v 27.42328 h 23.99527 v -20.56747 h 10.28369 v 20.56747 h 6.85579 v -27.42328 h 6.8558 z m -13.71157,27.42318 h 10.28368 v 13.71171 h -10.28368 z" />
