<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 5 - Nexus Multiresolution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #1e1e2e; }
        #viewer { width: 100vw; height: 100vh; }
        #info h3 { font-size: 16px; margin-bottom: 8px; color: #89dceb; }
        #info code { background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 3px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import { ThreePresenter, DefaultUI, StaticBaseUrlResolver } from '../dist/three-presenter.js';

        const presenter = new ThreePresenter({ 
            mount: 'viewer',
            fileUrlResolver: new StaticBaseUrlResolver('../assets')
        });
        const ui = new DefaultUI(presenter);

        presenter.loadScene({
            models: [{ id: 'venus-nexus', file: 'laurana.nxz' }],
            environment: { showGround: true, background: '#1e1e2e' }
        }).then(() => {
            ui.setButtonVisible('home', true);
            ui.setButtonVisible('light', true);
            ui.setButtonVisible('fullscreen', true);
            console.log('✅ Nexus model loaded - resolution adapts as you navigate');
        }).catch(err => {
            console.error('Failed to load Nexus model:', err);
        });
    </script>
</body>
</html>
