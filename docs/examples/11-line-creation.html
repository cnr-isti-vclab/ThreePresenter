<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 11 - Line Annotation Creation and Editing</title>
  <style>
    body { margin: 0; font-family: system-ui; }
    #viewer { width: 100vw; height: 100vh; }
    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      max-width: 340px;
      background: rgba(255, 255, 255, 0.92);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    button { padding: 6px 10px; cursor: pointer; }
    button.active { background: #198754; color: #fff; border-color: #198754; }
    label { margin-left: 8px; }
    #status { margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="ui">
    <button id="line" type="button">Draw line</button>
    <label><input id="editing" type="checkbox" checked> Edit vertices</label>
    <label><input id="surface-follow" type="checkbox"> Surface follow</label>
    <div id="status">Select a line to edit it. Surface follow creates dense samples along the visible model surface while retaining sparse editable controls.</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import { ThreePresenter, StaticBaseUrlResolver } from '../dist/three-presenter.js';

    const presenter = new ThreePresenter({
      mount: 'viewer',
      fileUrlResolver: new StaticBaseUrlResolver('../assets')
    });
    const annotations = [];
    const lineButton = document.getElementById('line');
    const editingCheckbox = document.getElementById('editing');
    const surfaceFollowCheckbox = document.getElementById('surface-follow');
    const status = document.getElementById('status');

    lineButton.addEventListener('click', () => {
      const active = presenter.getAnnotationCreationMode() === 'line';
      presenter.setAnnotationCreationMode(active ? null : 'line');
    });

    editingCheckbox.addEventListener('change', () => {
      presenter.setAnnotationEditingEnabled(editingCheckbox.checked);
      status.textContent = editingCheckbox.checked
        ? 'Vertex editing enabled: drag, insert with double-click, or select and delete vertices.'
        : 'Inspection only: annotations remain selectable.';
    });

    surfaceFollowCheckbox.addEventListener('change', () => {
      presenter.setLineSurfaceFollowEnabled(surfaceFollowCheckbox.checked);
      status.textContent = surfaceFollowCheckbox.checked
        ? 'Surface follow enabled: new line segments are projected onto the visible model surface.'
        : 'Surface follow disabled: new line segments are straight 3D chords.';
    });

    presenter.onAnnotationCreationModeChange = (mode) => {
      lineButton.classList.toggle('active', mode === 'line');
      lineButton.textContent = mode === 'line' ? 'Stop drawing' : 'Draw line';
    };

    presenter.onAnnotationGeometryCreated = (type, geometry) => {
      annotations.push({
        id: `line-${annotations.length + 1}`,
        label: `Line ${annotations.length + 1}`,
        type,
        geometry
      });
      presenter.getAnnotationManager().render(annotations);
      status.textContent = `Created ${geometry.length} vertices. Stop drawing and select the line to move, insert, or delete vertices.`;
    };

    presenter.getAnnotationManager().onAnnotationUpdated((updated) => {
      const index = annotations.findIndex(({ id }) => id === updated.id);
      if (index !== -1) annotations[index] = updated;
      status.textContent = 'Line vertex updated.';
    });

    await presenter.loadScene({
      models: [{ id: 'model', file: 'venus.glb' }],
      environment: { showGround: true }
    });
  </script>
</body>
</html>
