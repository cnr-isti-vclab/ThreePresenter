<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 2 - All UI Controls</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #2c2c2c; }
    #viewer { width: 100vw; height: 100vh; }
    #info { 
      position: absolute; top: 20px; left: 20px; 
      background: rgba(0,0,0,0.8); color: white; 
      padding: 15px; border-radius: 8px; 
      font-size: 13px; line-height: 1.6; 
    }
    #info h3 { font-size: 16px; margin-bottom: 8px; color: #4fc3f7; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="info">
    <h3>🎛️ All UI Controls</h3>
    <p>Try all the buttons on the right →</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import { ThreePresenter } from '../dist/three-presenter.js';

    const presenter = new ThreePresenter('viewer');

    presenter.loadScene({
      models: [{ id: 'model', file: 'venus.glb', rotation: [-90, 0, 0] }],
      environment: { showGround: true, background: '#2c2c2c' }
    }).then(() => {
      // Show all available UI buttons
      presenter.setButtonVisible('home', true);
      presenter.setButtonVisible('light', true);
      presenter.setButtonVisible('env', true);
      presenter.setButtonVisible('screenshot', true);
      presenter.setButtonVisible('camera', true);
      presenter.setButtonVisible('annotation', true);
    });
  </script>
</body>
</html>
