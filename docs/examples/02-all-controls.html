<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 2 - All UI Controls</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #2c2c2c; }
    #viewer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import { ThreePresenter, DefaultUI, StaticBaseUrlResolver } from '../dist/three-presenter.js';

    const presenter = new ThreePresenter({ 
      mount: 'viewer',
      fileUrlResolver: new StaticBaseUrlResolver('../assets')
    });
    const ui = new DefaultUI(presenter);

    presenter.loadScene({
      models: [{ id: 'model', file: 'venus.glb', rotation: [-90, 0, 0] }],
      environment: { showGround: true, background: '#2c2c2c' }
    }).then(() => {
      // Show all available UI buttons
      ui.setButtonVisible('home', true);
      ui.setButtonVisible('light', true);
      ui.setButtonVisible('env', true);
      ui.setButtonVisible('screenshot', true);
      ui.setButtonVisible('camera', true);
      ui.setButtonVisible('annotation', true);
    });
  </script>
</body>
</html>
