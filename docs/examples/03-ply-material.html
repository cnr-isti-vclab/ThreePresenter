<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 3 - PLY with Custom Material</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #1a1a1a; }
    #viewer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import { ThreePresenter, DefaultUI, StaticBaseUrlResolver } from '../dist/three-presenter.js';

    const presenter = new ThreePresenter({ 
      mount: 'viewer',
      fileUrlResolver: new StaticBaseUrlResolver('../assets')
    });
    const ui = new DefaultUI(presenter);

    presenter.loadScene({
      models: [{
        id: 'ply-model',
        file: 'bunny.ply',
        material: {
          color: '#ff4444',
          metalness: 0.2,
          roughness: 0.7,
          flatShading: false
        }
      }],
      environment: { showGround: true, background: '#1a1a1a' }
    }).then(() => {
      ui.setButtonVisible('home', true);
      ui.setButtonVisible('light', true);
      console.log('✅ PLY loaded with custom red material');
    }).catch(err => {
      console.warn('Note: bunny.ply not found, trying venus.glb instead');
      // Fallback to GLB if PLY not available
      presenter.loadScene({
        models: [{
          id: 'fallback',
          file: 'venus.glb',
          material: { color: '#ff4444', metalness: 0.2, roughness: 0.7 }
        }],
        environment: { showGround: true, background: '#1a1a1a' }
      }).then(() => {
        ui.setButtonVisible('home', true);
        ui.setButtonVisible('light', true);
      });
    });
  </script>
</body>
</html>
