<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 7 - External Controls</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; }
    #viewer { width: 100vw; height: 100vh; }

    #controls {
      position: fixed;
      top: 12px;
      left: 12px;
      display: grid;
      grid-template-columns: auto auto auto;
      align-items: center;
      gap: 5px 6px;
      z-index: 100;
    }

    .model-label {
      color: #fff;
      font-size: 13px;
      font-family: system-ui;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      padding-right: 2px;
    }

    .toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      background: rgba(30, 30, 30, 0.82);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.15s, opacity 0.15s;
      user-select: none;
    }

    .toggle-btn:hover { background: rgba(30, 30, 30, 0.95); }

    .toggle-btn.off {
      opacity: 0.45;
    }

    .toggle-btn i {
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="viewer"></div>

  <div id="controls">
    <span class="model-label">Venus</span>
    <button class="toggle-btn" id="btn-venus-vis"   title="Toggle visibility"><i class="bi bi-eye"></i></button>
    <button class="toggle-btn" id="btn-venus-bbox"  title="Toggle bounding box"><i class="bi bi-bounding-box"></i></button>

    <span class="model-label">Bacchus</span>
    <button class="toggle-btn" id="btn-bacchus-vis"  title="Toggle visibility"><i class="bi bi-eye"></i></button>
    <button class="toggle-btn" id="btn-bacchus-bbox" title="Toggle bounding box"><i class="bi bi-bounding-box"></i></button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import { ThreePresenter, StaticBaseUrlResolver } from '../dist/three-presenter.js';

    const presenter = new ThreePresenter({
      mount: 'viewer',
      fileUrlResolver: new StaticBaseUrlResolver('../assets')
    });

    await presenter.loadScene({
      models: [
        { id: 'venus',   file: 'sphere_r1_000.ply',  origin: 'model_coord',  position: [ 0, 1, 0] },
        { id: 'bacchus', file: 'sphere_r1_500.ply',  origin: 'model_coord',   position: [ 0, 1, 0] }
      ],
      environment: { showGround: true }
    });

    // --- Visibility toggle ---
    function makeVisToggle(btnId, modelId) {
      const btn = document.getElementById(btnId);
      let visible = true;
      btn.addEventListener('click', () => {
        visible = !visible;
        presenter.setModelVisibility(modelId, visible);
        btn.classList.toggle('off', !visible);
        btn.querySelector('i').className = visible ? 'bi bi-eye' : 'bi bi-eye-slash';
      });
    }

    // --- Bounding box toggle ---
    function makeBboxToggle(btnId, modelId) {
      const btn = document.getElementById(btnId);
      let shown = false;
      btn.classList.add('off');
      btn.addEventListener('click', () => {
        shown = !shown;
        presenter.setModelBoundingBoxVisible(modelId, shown);
        btn.classList.toggle('off', !shown);
      });
    }

    makeVisToggle('btn-venus-vis',    'venus');
    makeVisToggle('btn-bacchus-vis',  'bacchus');
    makeBboxToggle('btn-venus-bbox',  'venus');
    makeBboxToggle('btn-bacchus-bbox','bacchus');
  </script>
</body>
</html>
