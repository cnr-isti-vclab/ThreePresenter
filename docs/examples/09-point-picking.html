<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 9 - Point Picking</title>
  <style>
    body { margin: 0; font-family: system-ui; }
    #viewer { width: 100vw; height: 100vh; }
    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      padding: 8px;
      border-radius: 8px;
    }
    #out { margin-top: 8px; font-size: 13px; white-space: pre-line; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="ui">
    <button id="pick" type="button">Pick point</button>
    <div id="out">No point selected yet.</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import { ThreePresenter, StaticBaseUrlResolver } from '../dist/three-presenter.js';

    const presenter = new ThreePresenter({
      mount: 'viewer',
      fileUrlResolver: new StaticBaseUrlResolver('../assets')
    });
    const annotations = [];
    let pickId = 0;

    const pick = document.getElementById('pick');
    const out = document.getElementById('out');

    pick.addEventListener('click', () => {
      presenter.togglePickingMode();
      pick.textContent = presenter.isPickingMode ? 'Picking: double-click model' : 'Pick point';
    });

    presenter.onPointPicked = (point) => {
      pick.textContent = 'Pick point';
      annotations.push({
        id: `picked-${++pickId}`,
        label: `Picked ${pickId}`,
        type: 'point',
        geometry: point
      });
      presenter.getAnnotationManager().render(annotations);
      out.textContent = `Picked point:\n[${point.map(v => v.toFixed(4)).join(', ')}]`;
    };

    await presenter.loadScene({
      models: [{ id: 'model', file: 'venus.glb' }],
      environment: { showGround: true }
    });
  </script>
</body>
</html>
