<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThreePresenter Examples</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body style="height: 100vh; overflow: hidden; background: #f5f5f5;">
  <div class="examples-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>ThreePresenter</h1>
        <p>Interactive Examples</p>
      </div>
      <a href="../index.html" class="example-item" style="border-top: 1px solid rgba(255,255,255,0.1);">← Back to Main Page</a>
      <nav class="examples-list" id="examplesList"></nav>
    </aside>

    <main class="main-content">
      <header class="content-header">
        <h2 id="exampleTitle">Select an example</h2>
      </header>
      
      <div class="split-view">
        <div class="preview-pane">
          <div class="loading" id="previewLoading">Select an example to preview</div>
          <iframe id="previewFrame" style="display: none;"></iframe>
        </div>

        <div class="code-pane">
          <div class="code-header">
            <span class="code-title">Source Code</span>
            <button class="copy-btn" id="copyBtn">Copy</button>
          </div>
          <pre class="code-block"><code id="codeContent">// Select an example to view its code</code></pre>
        </div>
      </div>
    </main>
  </div>

  <script>
    let examples = [];

    function buildExamplesJsonUrl() {
      // Works for:
      // - /examples/index.html
      // - /examples
      // - /docs/examples/index.html
      // - /ThreePresenter/examples/index.html (GitHub Pages project path)
      const path = window.location.pathname;
      const marker = '/examples';
      const idx = path.indexOf(marker);
      const basePath = idx >= 0 ? path.slice(0, idx) : '';
      return `${basePath}/examples/examples.json`;
    }

    // Load examples from JSON
    fetch(buildExamplesJsonUrl())
      .then(r => {
        if (!r.ok) {
          throw new Error(`HTTP ${r.status} while fetching examples.json`);
        }
        return r.json();
      })
      .then(data => {
        examples = data.examples ?? data;
        renderExamplesList();
        handleHash();
      })
      .catch(err => {
        console.error('Failed to load examples:', err);
        document.getElementById('examplesList').innerHTML = `<div style="padding: 20px; color: #e74c3c;">Failed to load examples (${err.message})</div>`;
      });

    let currentExample = null;

    // Render examples list
    function renderExamplesList() {
      const listEl = document.getElementById('examplesList');
      listEl.innerHTML = examples.map((ex, idx) => `
        <div class="example-item" data-id="${ex.id}">
          <div class="title">${ex.title}</div>
          <div class="accordion-desc">${ex.descriptionHtml ?? ex.description ?? ''}</div>
        </div>
      `).join('');

      // Add click handlers (only for items with data-id, not the back link)
      document.querySelectorAll('.example-item[data-id]').forEach(item => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          loadExample(item.dataset.id);
        });
      });
    }

    // Load example
    async function loadExample(id) {
      const example = examples.find(ex => ex.id === id);
      if (!example) return;

      currentExample = example;

      // Update UI
      document.querySelectorAll('.example-item').forEach(item => {
        item.classList.toggle('active', item.dataset.id === id);
      });

      document.getElementById('exampleTitle').textContent = example.title;

      // Load preview
      const previewFrame = document.getElementById('previewFrame');
      const previewLoading = document.getElementById('previewLoading');
      
      previewLoading.style.display = 'flex';
      previewFrame.style.display = 'none';
      
      previewFrame.src = example.file;
      
      previewFrame.onload = () => {
        previewLoading.style.display = 'none';
        previewFrame.style.display = 'block';
      };

      // Display source code
      displayCode(example.source);

      // Update URL
      window.location.hash = id;
    }

    // Display code
    function displayCode(code) {
      document.getElementById('codeContent').textContent = code;
    }

    // Copy code to clipboard
    document.getElementById('copyBtn').addEventListener('click', async () => {
      const btn = document.getElementById('copyBtn');
      const code = document.getElementById('codeContent').textContent;
      
      try {
        await navigator.clipboard.writeText(code);
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        console.error('Failed to copy:', err);
      }
    });

    // Handle hash navigation
    function handleHash() {
      const hash = window.location.hash.slice(1);
      if (hash && examples.find(ex => ex.id === hash)) {
        loadExample(hash);
      } else if (examples.length > 0) {
        loadExample(examples[0].id);
      }
    }

    window.addEventListener('hashchange', handleHash);

    // Initialize
    renderExamplesList();
    handleHash();
  </script>
</body>
</html>
