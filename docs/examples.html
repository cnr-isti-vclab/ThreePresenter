<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThreePresenter Examples</title>
  <meta http-equiv="refresh" content="0; url=examples/index.html">
  <link rel="icon" type="image/png" href="img/3p_32.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .redirect-message {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .redirect-message h1 {
      font-size: 24px;
      margin-bottom: 15px;
      color: #2c3e50;
    }
    .redirect-message p {
      color: #7f8c8d;
      margin-bottom: 20px;
    }
    .redirect-message a {
      color: #3498db;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="redirect-message">
    <h1>Redirecting to Examples...</h1>
    <p>If you are not redirected automatically, <a href="examples/index.html">click here</a>.</p>
  </div>
</body>
</html>
