name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]  # Trigger on push to main branch
  workflow_dispatch:  # Allow manual triggering of the workflow

permissions:
  contents: read  # Read access to repository contents
  pages: write  # Write access to GitHub Pages
  id-token: write  # Write access for ID tokens

concurrency:
  group: "pages"  # Group for concurrency control
  cancel-in-progress: false  # Do not cancel in-progress jobs

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Checkout the repository

      - name: Setup Node
        uses: actions/setup-node@v4  # Set up Node.js environment
        with:
          node-version: "20"  # Specify Node.js version
          cache: 'npm'  # Enable npm caching

      - name: Install dependencies
        run: npm ci  # Install project dependencies

      - name: Build for deployment
        run: npm run deploy  # Build library, generate docs, copy to docs/dist, generate examples.json

      - name: Setup Pages
        uses: actions/configure-pages@v5  # Configure GitHub Pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3  # Upload documentation as an artifact
        with:
          path: './docs'  # Path to the docs folder

  deploy:
    environment:
      name: github-pages  # Specify the deployment environment
      url: ${{ steps.deployment.outputs.page_url }}  # URL of the deployed site
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner
    needs: build  # Ensure build job completes before deploying
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  # Deploy to GitHub Pages
